name: Release & Marketplace Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: 'Publish extension to Visual Studio Marketplace'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  build-binaries:
    name: Compile Engine (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            core_bin: knowframe-core
            cli_bin: knowframe-cli
            use_cross: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            core_bin: knowframe-core
            cli_bin: knowframe-cli
            use_cross: true

          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x64
            core_bin: knowframe-core
            cli_bin: knowframe-cli
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
            core_bin: knowframe-core
            cli_bin: knowframe-cli
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            core_bin: knowframe-core.exe
            cli_bin: knowframe-cli.exe
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for ARM Linux cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Release Binaries
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Stage Artifacts
        shell: bash
        run: |
          mkdir -p stage/${{ matrix.platform }}
          TARGET_DIR="target/${{ matrix.target }}/release"
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="target/release"
          fi
          cp "$TARGET_DIR/${{ matrix.core_bin }}" stage/${{ matrix.platform }}/
          cp "$TARGET_DIR/${{ matrix.cli_bin }}" stage/${{ matrix.platform }}/

      - name: Upload Platform Binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: stage/${{ matrix.platform }}/*

  package-and-publish:
    name: Package VSIX & Publish
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: staged-binaries

      - name: Verify All Platform Binaries
        run: |
          for plat in win32-x64 darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            if [ ! -d "staged-binaries/binaries-$plat" ] || [ -z "$(ls -A "staged-binaries/binaries-$plat")" ]; then
              echo "❌ Missing compiled binaries for platform: $plat"
              exit 1
            fi
          done
          echo "--> Staged platform binaries verified:"
          ls -laR staged-binaries/

      - name: Build Extension Host & Webview UI
        working-directory: extension
        run: npm run package

      - name: Run Extension Unit Tests
        working-directory: extension
        run: npm test

      - name: Package Clean Platform-Specific & Universal VSIX Archives
        working-directory: extension
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Packaging KnowFrame v$VERSION..."

          # 1. Clean platform-specific VSIX packages (ONLY that platform's binaries, ~6-7 MB each)
          for target in win32-x64 darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            echo "📦 Packaging target: $target..."
            rm -rf bin
            mkdir -p "bin/$target"
            cp "../staged-binaries/binaries-$target/"* "bin/$target/"
            chmod +x "bin/$target/"* 2>/dev/null || true
            npx --yes @vscode/vsce package --target "$target" --no-dependencies -o "knowframe-${target}-${VERSION}.vsix"
          done

          # 2. Clean Universal Fallback VSIX (bundles all 5 platform folders once for win32-arm64, alpine, etc.)
          echo "📦 Packaging universal fallback VSIX..."
          rm -rf bin
          for plat in win32-x64 darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            mkdir -p "bin/$plat"
            cp "../staged-binaries/binaries-$plat/"* "bin/$plat/"
            chmod +x "bin/$plat/"* 2>/dev/null || true
          done
          npx --yes @vscode/vsce package --no-dependencies -o "knowframe-${VERSION}.vsix"

          echo "--> Generated clean VSIX packages:"
          ls -lh *.vsix

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: KnowFrame ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            extension/*.vsix

      - name: Publish All Platforms to Visual Studio Marketplace
        if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_marketplace == 'true')
        working-directory: extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHER=$(node -p "require('./package.json').publisher")
          EXT_NAME=$(node -p "require('./package.json').name")
          FULL_ID="${PUBLISHER}.${EXT_NAME}"

          if [ -n "$VSCE_PAT" ]; then
            echo "🔑 Publishing using VSCE_PAT secret..."
            AUTH_ARGS=(-p "$VSCE_PAT")
          else
            echo "🛡️ Publishing using OIDC Trusted Publishing (--oidc)..."
            AUTH_ARGS=(--oidc)
          fi

          publish_pkg() {
            local label="$1"
            local file="$2"
            if [ ! -f "$file" ]; then
              echo "❌ Missing VSIX package: $file"
              exit 1
            fi
            echo "🚀 Publishing ${label}: ${file}..."
            npx --yes @vscode/vsce publish --packagePath "$file" --skip-duplicate "${AUTH_ARGS[@]}"
          }

          # 1. Publish Universal fallback first (ensures every OS/architecture including win32-arm64 & alpine is supported)
          publish_pkg "universal" "knowframe-${VERSION}.vsix"
          sleep 5

          # 2. Publish all 5 native platform-specific packages (no || true; fail fast on auth/API error)
          for target in win32-x64 darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            publish_pkg "$target" "knowframe-${target}-${VERSION}.vsix"
            sleep 5
          done

          # 3. Verify all 6 packages (universal + 5 platforms) are validated on the live Marketplace API
          #    Self-heals if Marketplace drops concurrent uploads while an earlier upload is validating.
          echo "🔍 Verifying Marketplace validation for ${FULL_ID} v${VERSION}..."
          RETRY_COUNT=0
          MAX_RETRIES=12
          ALL_VALID="PENDING"

          for attempt in $(seq 1 45); do
            RESPONSE=$(curl -sS -m 20 -X POST \
              -H "Content-Type: application/json" \
              -H "Accept: application/json;api-version=7.1-preview.1" \
              -d "{\"filters\":[{\"criteria\":[{\"filterType\":7,\"value\":\"${FULL_ID}\"}],\"pageSize\":10}],\"flags\":1}" \
              "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery")

            STATUS_LINE=$(echo "$RESPONSE" | node -e "
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const vs = (d.results?.[0]?.extensions?.[0]?.versions || []).filter(v => v.version === '${VERSION}');
              const expected = ['universal', 'win32-x64', 'darwin-arm64', 'darwin-x64', 'linux-x64', 'linux-arm64'];
              const byTarget = new Map(vs.map(v => [v.targetPlatform || 'universal', v.flags || 'none']));
              const summary = expected.map(t => t + '=' + (byTarget.get(t) || 'MISSING')).join(' ');
              const validating = expected.filter(t => byTarget.has(t) && !String(byTarget.get(t)).includes('validated'));
              const missing = expected.filter(t => !byTarget.has(t));
              const validatedCount = expected.filter(t => String(byTarget.get(t) || '').includes('validated')).length;
              console.log(JSON.stringify({ summary, validating, missing, validatedCount, total: expected.length }));
            ")

            SUMMARY=$(echo "$STATUS_LINE" | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).summary)")
            VALIDATED_COUNT=$(echo "$STATUS_LINE" | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).validatedCount)")
            TOTAL_COUNT=$(echo "$STATUS_LINE" | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).total)")
            VALIDATING_COUNT=$(echo "$STATUS_LINE" | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).validating.length)")
            FIRST_MISSING=$(echo "$STATUS_LINE" | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).missing[0] || '')")

            echo "Attempt ${attempt}/45 (${VALIDATED_COUNT}/${TOTAL_COUNT} validated): ${SUMMARY}"

            if [ "$VALIDATED_COUNT" -eq "$TOTAL_COUNT" ]; then
              ALL_VALID="OK"
              echo "✅ All ${TOTAL_COUNT} Marketplace packages (universal + Windows/macOS/Linux) are VALIDATED and LIVE!"
              break
            fi

            # If nothing is currently validating, yet a target is missing, re-upload that single missing target
            if [ "$VALIDATING_COUNT" -eq 0 ] && [ -n "$FIRST_MISSING" ]; then
              if [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; then
                RETRY_COUNT=$((RETRY_COUNT + 1))
                echo "🔄 Target '${FIRST_MISSING}' not present after validation settled (retry ${RETRY_COUNT}/${MAX_RETRIES}). Re-publishing..."
                if [ "$FIRST_MISSING" = "universal" ]; then
                  publish_pkg "universal" "knowframe-${VERSION}.vsix"
                else
                  publish_pkg "$FIRST_MISSING" "knowframe-${FIRST_MISSING}-${VERSION}.vsix"
                fi
              fi
            fi

            sleep 20
          done

          if [ "$ALL_VALID" != "OK" ]; then
            echo "❌ Marketplace validation did not complete for all platforms: ${SUMMARY}"
            exit 1
          fi
