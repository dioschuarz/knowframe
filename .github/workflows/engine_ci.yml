name: Engine CI & Cross-Compilation Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  engine-matrix:
    name: Build & Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: knowframe-core
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: knowframe-core
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: knowframe-core
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: knowframe-core
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: knowframe-core.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation targets)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Run Cargo Check & Tests
        if: "!matrix.use_cross"
        shell: bash
        run: |
          cargo check --workspace
          cargo test --workspace --exclude knowframe-cli

      - name: Build Release Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Verify Binary Packaging Budget (<= 25 MB per NFR-009)
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          if [ ! -f "$BIN_PATH" ]; then
            BIN_PATH="target/release/${{ matrix.binary_name }}"
          fi
          if [ -f "$BIN_PATH" ]; then
            SIZE_BYTES=$(wc -c < "$BIN_PATH" | tr -d ' ')
            MAX_BYTES=$((25 * 1024 * 1024))
            echo "Binary size: $SIZE_BYTES bytes (budget: $MAX_BYTES bytes)"
            if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
              echo "Error: Binary exceeds 25MB packaging budget"
              exit 1
            fi
          fi
        shell: bash

  extension-test:
    name: Extension Host & Webview Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Run Extension Linter & Tests
        working-directory: extension
        run: |
          npm run lint
          npm test
          npm run compile
