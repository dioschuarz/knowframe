[package]
name = "llm-wiki-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "High-performance Rust core engine for LLM Wiki VS Code extension"

[[bin]]
name = "llm-wiki-core"
path = "src/main.rs"

[lib]
name = "llm_wiki_core"
path = "src/lib.rs"

[dependencies]
pulldown-cmark = "0.11"
petgraph = { version = "0.6", features = ["serde-1"] }
tiktoken-rs = "0.5"
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
globset = "0.4"
walkdir = "2.5"
regex = "1.10"
lazy_static = "1.4"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
sha2 = "0.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3.10"

[[bench]]
name = "graph_bench"
harness = false

[[bench]]
name = "trace_benchmark"
harness = false

[[bench]]
name = "candidate_benchmark"
harness = false

[[bench]]
name = "fingerprint_benchmark"
harness = false

[[bench]]
name = "sync_benchmark"
harness = false

[[bench]]
name = "fragment_benchmark"
harness = false
