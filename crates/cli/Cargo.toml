[package]
name = "llm-wiki-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI driver for KnowFrame deterministic knowledge engine"

[lib]
name = "llm_wiki_cli"
path = "src/lib.rs"

[[bin]]
name = "knowframe-cli"
path = "src/main.rs"

[dependencies]
llm-wiki-core = { path = "../core" }
llm-wiki-engine = { path = "../engine" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
