[package]
name = "llm-wiki-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Deterministic Knowledge Engine JSON-RPC server and protocol"

[lib]
name = "llm_wiki_engine"
path = "src/lib.rs"

[dependencies]
llm-wiki-core = { path = "../core" }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.10"
