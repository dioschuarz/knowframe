<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#111116"/>
      <stop offset="70%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#020203"/>
    </radialGradient>
    <linearGradient id="stem-tl" x1="130" y1="148" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="stem-tr" x1="382" y1="148" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="stem-bl" x1="130" y1="364" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="stem-br" x1="382" y1="364" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="amber-hub" x1="220" y1="220" x2="292" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="180" y="180" width="152" height="152" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg-grad)" stroke="#27272A" stroke-width="3.5"/>

  <!-- Subtle Ambient Circuit Grid -->
  <circle cx="256" cy="256" r="166" stroke="#1C1C21" stroke-width="1.5" stroke-dasharray="4 8" fill="none"/>
  <circle cx="256" cy="256" r="230" stroke="#151518" stroke-width="1" fill="none"/>

  <!-- Connecting Stems (Behind Nodes) -->
  <line x1="130" y1="148" x2="256" y2="256" stroke="url(#stem-tl)" stroke-width="27" stroke-linecap="round"/>
  <line x1="382" y1="148" x2="256" y2="256" stroke="url(#stem-tr)" stroke-width="27" stroke-linecap="round"/>
  <line x1="130" y1="364" x2="256" y2="256" stroke="url(#stem-bl)" stroke-width="27" stroke-linecap="round"/>
  <line x1="382" y1="364" x2="256" y2="256" stroke="url(#stem-br)" stroke-width="27" stroke-linecap="round"/>

  <!-- 4 Satellite Nodes (Signal White with Zinc Rim) -->
  <circle cx="130" cy="148" r="36" fill="#FFFFFF"/>
  <circle cx="130" cy="148" r="16" fill="#F4F4F5"/>

  <circle cx="382" cy="148" r="36" fill="#FFFFFF"/>
  <circle cx="382" cy="148" r="16" fill="#F4F4F5"/>

  <circle cx="130" cy="364" r="36" fill="#FFFFFF"/>
  <circle cx="130" cy="364" r="16" fill="#F4F4F5"/>

  <circle cx="382" cy="364" r="36" fill="#FFFFFF"/>
  <circle cx="382" cy="364" r="16" fill="#F4F4F5"/>

  <!-- Central Hub (Electric Amber Luminous Core) -->
  <circle cx="256" cy="256" r="54" fill="url(#amber-hub)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="24" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="10" fill="#050507"/>
</svg>